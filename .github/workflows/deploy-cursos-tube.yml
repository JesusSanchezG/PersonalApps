name: Deploy CursosTube a VPS

on:
  push:
    branches: [main]
    paths:
      - 'cursosTube/**'
      - '.github/workflows/deploy-cursos-tube.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cursostube
  cancel-in-progress: true

defaults:
  run:
    working-directory: cursosTube

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cursosTube/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy por rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -p $VPS_PORT -i ~/.ssh/id_deploy" cursosTube/dist/ "root@$VPS_HOST:/var/www/cursos.jesussanchez.me/"
          ssh -p "$VPS_PORT" -i ~/.ssh/id_deploy "root@$VPS_HOST" "chown -R 1000:1000 /var/www/cursos.jesussanchez.me"